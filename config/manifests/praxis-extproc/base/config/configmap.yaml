apiVersion: v1
kind: ConfigMap
metadata:
  name: payload-processing-plugins
data:
  # Pre-auth (BBR) Praxis chain: promote body model to a routing header, then
  # rewrite publisher IDs in the JSON body for KServe upstream routing.
  pre-extproc.yaml: |
    server:
      grpc_address: "0.0.0.0:9004"
      health_address: "0.0.0.0:50052"
      metrics_address: "0.0.0.0:9090"
      tls:
        mode: self_signed

    filter_chains:
      - name: bbr
        filters:
          - filter: model_to_header
            header: X-Gateway-Model-Name
          - filter: llmisvc_model_provider_resolver
            header: X-Gateway-Model-Name

    insecure_options:
      allow_unbounded_body: true

  # Existing MaaS post-auth chain. ExternalModel routing is deliberately not
  # placed here: this buffered pipeline is shared by normal MaaS/KServe
  # traffic and must remain unchanged.
  extproc.yaml: |
    server:
      grpc_address: "0.0.0.0:9004"
      health_address: "0.0.0.0:50052"
      metrics_address: "0.0.0.0:9090"
      tls:
        mode: self_signed

    filter_chains:
      - name: ipp
        filters:
          - filter: request_id

    insecure_options:
      allow_unbounded_body: true
